apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'

jobs:
  build:
    steps:
      - name: deploy
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: | 
          cd resume
          ./gradlew clean bootJar
          docker build -t tech-resume:latest .
          cd ../resume-ui
          docker build -t resume-ui:latest .
          cd ../
          docker compose up
